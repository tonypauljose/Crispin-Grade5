<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎂 10 Years of Crispin</title>
  <meta name="theme-color" content="#000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/birthday.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%82%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    body {
      background: #000;
      color: #fff;
      font-family: var(--font-body);
      cursor: none;          /* Hide cursor for TV display */
    }
    body.show-cursor { cursor: default; }

    /* ─── Stage ─── */
    .stage {
      position: fixed; inset: 0;
      overflow: hidden;
      background: #000;
    }
    .slide {
      position: absolute; inset: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .slide.active { opacity: 1; z-index: 1; }
    .slide img, .slide video {
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }
    .slide.active img { animation: ken-burns 7s ease-out forwards; }
    .slide.active video { animation: fade-in 0.6s ease-out; }
    @keyframes ken-burns {
      0%   { transform: scale(1)    translate(0, 0); }
      100% { transform: scale(1.12) translate(var(--kx, -1%), var(--ky, -1%)); }
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    /* ─── Ambient gradient backdrop behind letterboxed images ─── */
    .stage::before {
      content: "";
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(124,58,237,0.35) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(244,114,182,0.30) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(251,191,36,0.18) 0%, transparent 60%),
        #050410;
      z-index: 0;
    }

    /* ─── Section title card (between groups) ─── */
    .section-card {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      padding: 48px;
    }
    .section-card.show { opacity: 1; }
    .section-card__emoji {
      font-size: clamp(5rem, 14vw, 12rem);
      filter: drop-shadow(0 12px 30px rgba(244,114,182,0.4));
      margin-bottom: 24px;
      animation: bob 3s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-14px) rotate(3deg); }
    }
    .section-card__title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(3rem, 7vw, 6rem);
      line-height: 1;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #FBBF24 0%, #F472B6 50%, #A78BFA 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* ─── Caption ribbon over photos ─── */
    .caption {
      position: absolute;
      left: 0; right: 0; bottom: 60px;
      text-align: center;
      z-index: 4;
      pointer-events: none;
    }
    .caption__inner {
      display: inline-block;
      padding: 12px 28px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(1.2rem, 1.8vw, 1.6rem);
      letter-spacing: -0.01em;
    }

    /* ─── Title card (intro) ─── */
    .title-screen {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
      padding: 48px;
      background:
        radial-gradient(circle at 30% 30%, rgba(244,114,182,0.4) 0%, transparent 50%),
        radial-gradient(circle at 70% 70%, rgba(251,191,36,0.4) 0%, transparent 50%),
        #14142B;
      transition: opacity 1.5s ease, transform 1.5s ease;
    }
    .title-screen.gone {
      opacity: 0;
      transform: scale(1.1);
      pointer-events: none;
    }
    .title-screen__years {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(8rem, 22vw, 22rem);
      line-height: 0.85;
      background: linear-gradient(135deg, #FBBF24 0%, #F472B6 50%, #A78BFA 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 12px 50px rgba(244,114,182,0.5));
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }
    .title-screen__years sup {
      font-size: 0.4em;
      vertical-align: super;
    }
    .title-screen__sub {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(2rem, 4vw, 4rem);
      letter-spacing: -0.02em;
      margin-bottom: 32px;
    }
    .title-screen__cta {
      padding: 22px 48px;
      border-radius: 999px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.4rem;
      background: linear-gradient(135deg, #FBBF24, #F472B6);
      color: #14142B;
      border: none;
      cursor: pointer;
      box-shadow: 0 18px 50px rgba(244,114,182,0.5);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 18px 50px rgba(244,114,182,0.5); }
      50%      { transform: scale(1.05); box-shadow: 0 18px 60px rgba(251,191,36,0.7); }
    }

    /* ─── End screen ─── */
    .end-screen {
      position: absolute; inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 15;
      padding: 48px;
      background:
        radial-gradient(circle at 50% 30%, rgba(251,191,36,0.5) 0%, transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(244,114,182,0.4) 0%, transparent 50%),
        #14142B;
    }
    .end-screen.show { display: flex; }
    .end-screen__cake { font-size: clamp(8rem, 22vw, 18rem); animation: bob 2.5s ease-in-out infinite; }
    .end-screen__title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(3rem, 7vw, 6rem);
      line-height: 1;
      margin: 24px 0 8px;
      background: linear-gradient(135deg, #FBBF24 0%, #F472B6 50%, #A78BFA 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 8px 40px rgba(244,114,182,0.6));
    }
    .end-screen__sub {
      font-size: clamp(1.4rem, 2.4vw, 2rem);
      color: rgba(255,255,255,0.85);
      margin: 8px 0 32px;
    }

    /* ─── HUD (corner controls) ─── */
    .hud {
      position: fixed;
      bottom: 18px; left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex; gap: 14px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .hud.show { opacity: 1; pointer-events: auto; }
    .hud button, .hud a {
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
    }
    .hud button:hover, .hud a:hover { background: rgba(255,255,255,0.2); }

    .hint {
      position: fixed;
      bottom: 14px; right: 18px;
      z-index: 20;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.4);
      font-family: var(--font-mono, monospace);
      pointer-events: none;
    }

    /* ─── Confetti pieces ─── */
    .confetti-piece {
      position: fixed;
      top: -10vh;
      width: 10px; height: 14px;
      animation: cf-fall linear forwards;
      z-index: 25;
    }
    @keyframes cf-fall {
      to { transform: translateY(120vh) rotate(720deg); }
    }

    /* Sparkle layer over photos */
    .sparkles {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 3;
      background-image:
        radial-gradient(2px 2px at 8% 30%, rgba(255,255,255,0.6), transparent 50%),
        radial-gradient(1.5px 1.5px at 90% 70%, rgba(255,255,255,0.5), transparent 50%),
        radial-gradient(1.5px 1.5px at 30% 85%, rgba(255,255,255,0.5), transparent 50%);
    }
  </style>
</head>
<body>

  <!-- ───── Title screen (cake-cutting moment opener) ───── -->
  <div class="title-screen" id="title-screen">
    <div class="title-screen__years"><span id="years-num">10</span><sup>🎂</sup></div>
    <div class="title-screen__sub">years of <span style="background: linear-gradient(135deg, #FBBF24, #F472B6); -webkit-background-clip: text; background-clip: text; color: transparent;">Crispin</span></div>
    <button class="title-screen__cta" id="start-btn">▶ Start the slideshow</button>
    <p style="margin-top: 20px; color: rgba(255,255,255,0.5); font-size: 0.95rem;">
      Press <kbd style="background:rgba(255,255,255,0.1); padding:2px 8px; border-radius:4px;">Space</kbd> any time to pause ·
      <kbd style="background:rgba(255,255,255,0.1); padding:2px 8px; border-radius:4px;">←</kbd>
      <kbd style="background:rgba(255,255,255,0.1); padding:2px 8px; border-radius:4px;">→</kbd>
      to skip
    </p>
  </div>

  <!-- ───── Stage ───── -->
  <div class="stage" id="stage">
    <div class="sparkles"></div>
    <!-- slides injected by JS -->
    <div class="caption" id="caption" style="display:none;">
      <span class="caption__inner" id="caption-text"></span>
    </div>
  </div>

  <!-- ───── Letter finale (shown right before the end screen) ───── -->
  <div class="crispin-finale" id="crispin-finale">
    <div class="crispin-finale__row" id="crispin-letters">
      <!-- letters injected by JS so each can be animated individually -->
    </div>
  </div>

  <!-- ───── End screen ───── -->
  <div class="end-screen" id="end-screen">
    <div class="end-screen__cake">🎂</div>
    <div class="end-screen__title">Happy Birthday Crispin!</div>
    <div class="end-screen__sub">Make a wish 🕯️ … and blow out the candles!</div>
    <div style="display:flex; gap:14px; flex-wrap:wrap; justify-content:center;">
      <button class="title-screen__cta" id="replay-btn">🔁 Play again</button>
      <a class="title-screen__cta" href="party.html"
         style="background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.3);">
        🎮 Quiz Battle
      </a>
      <a class="title-screen__cta" href="index.html"
         style="background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.3);">
        🏠 Home
      </a>
    </div>
  </div>

  <!-- ───── HUD ───── -->
  <div class="hud" id="hud">
    <button id="prev-btn">◀ Prev</button>
    <button id="pause-btn">⏸ Pause</button>
    <button id="next-btn">Next ▶</button>
    <button id="end-btn">⏭ Skip to end</button>
    <a href="index.html">✕ Close</a>
  </div>

  <p class="hint" id="hint">Move mouse for controls</p>

<script src="data/birthday-memories.js"></script>
<script>
(function(){
  'use strict';

  // ─── Build a flat slide queue with section markers ───
  const memories = window.BIRTHDAY_MEMORIES || { sections: [] };
  const queue = [];   // {kind:'section', section} or {kind:'item', item, sectionTitle}
  memories.sections.forEach(sec => {
    if (!sec.items || !sec.items.length) return;
    queue.push({ kind: 'section', section: sec });
    sec.items.forEach(it => queue.push({ kind: 'item', item: it, sectionTitle: sec.title, sectionEmoji: sec.emoji }));
  });

  const stage = document.getElementById('stage');
  const captionEl = document.getElementById('caption');
  const captionTextEl = document.getElementById('caption-text');
  const titleScreen = document.getElementById('title-screen');
  const endScreen = document.getElementById('end-screen');
  const hud = document.getElementById('hud');
  const hintEl = document.getElementById('hint');

  let idx = 0;
  let advanceTimer = null;
  let paused = false;
  let currentSlide = null;

  // ─── Photo durations (long enough to read the caption + appreciate Ken Burns) ───
  const PHOTO_MS  = 5000;
  const VIDEO_MAX = 8000;   // safety cap if a video has no metadata yet
  const SECTION_MS = 2400;

  // ─── Slide creation ───
  function makeSlide(item) {
    const div = document.createElement('div');
    div.className = 'slide';
    if (item.type === 'photo') {
      const img = document.createElement('img');
      img.src = item.src;
      img.alt = item.alt || '';
      // Random Ken Burns direction (subtle pan)
      const kx = (Math.random() * 4 - 2).toFixed(1) + '%';
      const ky = (Math.random() * 4 - 2).toFixed(1) + '%';
      img.style.setProperty('--kx', kx);
      img.style.setProperty('--ky', ky);
      div.appendChild(img);
    } else {
      const v = document.createElement('video');
      v.src = item.src;
      v.muted = true;        // birthday song plays — keep video silent
      v.playsInline = true;
      v.autoplay = true;
      v.preload = 'auto';
      div.appendChild(v);
    }
    return div;
  }

  function showSection(sec) {
    const card = document.createElement('div');
    card.className = 'section-card';
    card.innerHTML = `
      <div class="section-card__emoji">${sec.emoji}</div>
      <div class="section-card__title">${sec.title}</div>
    `;
    stage.appendChild(card);
    // Force reflow then add show class
    requestAnimationFrame(() => card.classList.add('show'));
    captionEl.style.display = 'none';
    cleanupOldSlides(card);
    currentSlide = card;

    advanceTimer = setTimeout(() => {
      card.classList.remove('show');
      setTimeout(() => card.remove(), 700);
      next();
    }, SECTION_MS);
  }

  function showItem(item, sectionTitle, sectionEmoji) {
    const slide = makeSlide(item);
    stage.appendChild(slide);
    requestAnimationFrame(() => slide.classList.add('active'));
    cleanupOldSlides(slide);
    currentSlide = slide;

    // Caption
    captionEl.style.display = 'block';
    captionTextEl.textContent = `${sectionEmoji} ${sectionTitle}`;

    if (item.type === 'photo') {
      advanceTimer = setTimeout(next, PHOTO_MS);
    } else {
      const v = slide.querySelector('video');
      // Try to play; if we can't, advance after VIDEO_MAX
      const safety = setTimeout(next, VIDEO_MAX);
      v.addEventListener('loadedmetadata', () => {
        clearTimeout(safety);
        const dur = Math.min(v.duration * 1000, 12000);   // cap each clip at 12s
        advanceTimer = setTimeout(next, isFinite(dur) ? dur : VIDEO_MAX);
      });
      v.addEventListener('ended', () => {
        clearTimeout(safety);
        next();
      });
      v.addEventListener('error', () => {
        clearTimeout(safety);
        next();
      });
      v.play().catch(() => { /* ignore — autoplay sometimes blocked */ });
    }
  }

  function cleanupOldSlides(keep) {
    Array.from(stage.querySelectorAll('.slide, .section-card')).forEach(el => {
      if (el !== keep) {
        // keep the previous slide briefly so cross-fade looks smooth
        setTimeout(() => el.remove(), 1200);
      }
    });
  }

  function next() {
    if (paused) return;
    clearTimeout(advanceTimer);
    if (idx >= queue.length) return finish();
    const step = queue[idx++];
    if (step.kind === 'section') showSection(step.section);
    else showItem(step.item, step.sectionTitle, step.sectionEmoji);
  }

  function prev() {
    clearTimeout(advanceTimer);
    idx = Math.max(0, idx - 2);
    next();
  }

  function pause() {
    paused = true;
    clearTimeout(advanceTimer);
    const v = stage.querySelector('video');
    if (v) v.pause();
    document.getElementById('pause-btn').textContent = '▶ Resume';
    Song.pause();
  }
  function resume() {
    paused = false;
    document.getElementById('pause-btn').textContent = '⏸ Pause';
    Song.resume();
    next();
  }

  function finish() {
    clearTimeout(advanceTimer);
    Array.from(stage.querySelectorAll('.slide, .section-card')).forEach(el => el.classList.remove('show', 'active'));
    setTimeout(() => {
      Array.from(stage.querySelectorAll('.slide, .section-card')).forEach(el => el.remove());
    }, 1000);
    captionEl.style.display = 'none';

    // Run the letter-by-letter CRISPIN finale, then reveal the end screen
    runCrispinLetterFinale().then(() => {
      endScreen.classList.add('show');
      launchConfetti(220);
      setInterval(() => launchConfetti(40), 2000);
    });
  }

  // ── CRISPIN letter-by-letter reveal ─────────────────────
  function runCrispinLetterFinale() {
    return new Promise((resolve) => {
      const finale = document.getElementById('crispin-finale');
      const row = document.getElementById('crispin-letters');
      row.innerHTML = '';
      const letters = 'CRISPIN'.split('');
      letters.forEach((ch) => {
        const span = document.createElement('span');
        span.className = 'crispin-finale__letter';
        span.textContent = ch;
        row.appendChild(span);
      });

      finale.classList.add('show');

      // Audio context — make sure it's resumed (cake-cutting song
      // already unlocked the context on the start click)
      let ctx = null;
      try { ctx = window.__cakeAudioCtx || (window.__cakeAudioCtx = new (window.AudioContext || window.webkitAudioContext)()); } catch (_) {}
      if (ctx && ctx.state === 'suspended') ctx.resume();

      function chime(freq) {
        if (!ctx) return;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = freq;
        g.gain.setValueAtTime(0, ctx.currentTime);
        g.gain.linearRampToValueAtTime(0.16, ctx.currentTime + 0.02);
        g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
        o.connect(g).connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + 0.45);
      }

      // Ascending major-ish scale across the 7 letters: C D E G A C2 D2
      const scale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66];
      const stagger = 380;

      letters.forEach((_, i) => {
        setTimeout(() => {
          const span = row.children[i];
          span.classList.add('in');
          chime(scale[i] || 880);

          // Sparkles around each letter as it lands
          const r = span.getBoundingClientRect();
          for (let s = 0; s < 6; s++) {
            const sp = document.createElement('div');
            sp.className = 'crispin-finale__sparkle';
            sp.style.left = (r.left + r.width / 2 + (Math.random() * 80 - 40)) + 'px';
            sp.style.top  = (r.top  + r.height / 2 + (Math.random() * 80 - 40)) + 'px';
            document.body.appendChild(sp);
            setTimeout(() => sp.remove(), 1000);
          }
        }, i * stagger);
      });

      // Hold on the full word, then fade out and resolve
      const totalIn = letters.length * stagger + 600;
      setTimeout(() => {
        launchConfetti(140);
        // Big celebratory chord
        if (ctx) {
          [523.25, 659.25, 783.99].forEach((f, i) => {
            setTimeout(() => chime(f), i * 60);
          });
        }
      }, totalIn);

      const holdMs = 2200;
      setTimeout(() => {
        finale.classList.remove('show');
        setTimeout(resolve, 700);   // wait for fade-out
      }, totalIn + holdMs);
    });
  }

  // ─── Confetti ───
  function launchConfetti(count) {
    const colors = ['#FBBF24','#F472B6','#A78BFA','#34D399','#60A5FA','#FB7185','#FDE68A'];
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
      p.style.animationDelay = (Math.random() * 0.5) + 's';
      p.style.transform = `rotate(${Math.random() * 360}deg)`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 6000);
    }
  }

  // ─── Happy Birthday — procedural Web Audio melody ───
  // Plays "Happy Birthday to You" with Crispin's name.
  // If you prefer a real recording, drop an MP3 at assets/birthday-song.mp3
  // and the page will use that instead.
  const Song = (function(){
    let ctx = null;
    let nodes = [];
    let timer = null;
    let pausedAt = 0;
    let mp3 = null;

    function tryMp3() {
      const audio = new Audio('assets/birthday-song.mp3');
      audio.loop = true;
      audio.volume = 0.7;
      audio.addEventListener('canplaythrough', () => { /* loaded ok */ }, { once: true });
      audio.addEventListener('error', () => {
        mp3 = null; // fall back to procedural
      });
      mp3 = audio;
    }

    // ── Procedural melody fallback ──
    // Note: G=392, A=440, B=494, C=523, D=587, E=659, F=698, G2=784
    const NOTES = {
      G: 392.00, A: 440.00, B: 493.88, C: 523.25, D: 587.33, E: 659.25, F: 698.46, G2: 783.99,
    };

    // Format: [note, beats]   1 beat = 0.45s
    const BEAT = 0.45;
    const SCORE = [
      // Hap-py birth-day to you
      ['G', 0.75], ['G', 0.25], ['A', 1], ['G', 1], ['C', 1], ['B', 2],
      // Happy birthday to you
      ['G', 0.75], ['G', 0.25], ['A', 1], ['G', 1], ['D', 1], ['C', 2],
      // Happy birthday dear Crispin
      ['G', 0.75], ['G', 0.25], ['G2', 1], ['E', 1], ['C', 1], ['B', 1], ['A', 2],
      // Happy birthday to you
      ['F', 0.75], ['F', 0.25], ['E', 1], ['C', 1], ['D', 1], ['C', 2],
    ];

    function playProceduralLoop(startAt = 0) {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();

      let t = ctx.currentTime + 0.05;
      const totalDur = SCORE.reduce((s, [, b]) => s + b * BEAT, 0);

      function scheduleVerse(startTime) {
        let cursor = startTime;
        SCORE.forEach(([note, beats]) => {
          const dur = beats * BEAT;
          const freq = NOTES[note];
          // Two oscillators — sine + soft triangle for warmth
          [
            { type: 'sine',     gain: 0.18 },
            { type: 'triangle', gain: 0.07 },
          ].forEach(o => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = o.type;
            osc.frequency.value = freq;
            const start = cursor, end = cursor + dur * 0.92;
            g.gain.setValueAtTime(0, start);
            g.gain.linearRampToValueAtTime(o.gain, start + 0.04);
            g.gain.setValueAtTime(o.gain * 0.9, end - 0.08);
            g.gain.linearRampToValueAtTime(0, end);
            osc.connect(g).connect(ctx.destination);
            osc.start(start);
            osc.stop(end + 0.05);
            nodes.push(osc, g);
          });
          cursor += dur;
        });
      }

      scheduleVerse(t);
      // Loop the song ~every totalDur+1.5s so it feels continuous
      timer = setTimeout(() => playProceduralLoop(), (totalDur + 1.2) * 1000);
    }

    function start() {
      if (mp3) {
        mp3.play().catch(() => {
          // Browser blocked autoplay — fall back to procedural
          mp3 = null;
          playProceduralLoop();
        });
      } else {
        playProceduralLoop();
      }
    }
    function pause() {
      if (mp3) { try { mp3.pause(); } catch(_){} }
      if (timer) { clearTimeout(timer); timer = null; }
      if (ctx) { try { ctx.suspend(); } catch(_){} }
    }
    function resume() {
      if (mp3) { try { mp3.play(); } catch(_){} }
      if (ctx) { try { ctx.resume(); } catch(_){} }
      if (!ctx && !mp3) start();
    }
    function stop() {
      pause();
      nodes.forEach(n => { try { n.disconnect(); } catch(_){} });
      nodes = [];
    }

    return { tryMp3, start, pause, resume, stop };
  })();

  // ─── Launch ───
  document.getElementById('start-btn').addEventListener('click', () => {
    Song.tryMp3();
    titleScreen.classList.add('gone');
    setTimeout(() => titleScreen.remove(), 1600);
    Song.start();
    setTimeout(() => { idx = 0; next(); }, 800);
  });

  document.getElementById('replay-btn').addEventListener('click', () => {
    endScreen.classList.remove('show');
    idx = 0;
    Song.start();
    next();
  });

  // ─── Controls ───
  document.getElementById('prev-btn').addEventListener('click', prev);
  document.getElementById('next-btn').addEventListener('click', next);
  document.getElementById('pause-btn').addEventListener('click', () => paused ? resume() : pause());
  document.getElementById('end-btn').addEventListener('click', finish);

  // Mouse activity → show HUD briefly
  let hudTimer = null;
  function showHud() {
    document.body.classList.add('show-cursor');
    hud.classList.add('show');
    hintEl.style.opacity = '0';
    clearTimeout(hudTimer);
    hudTimer = setTimeout(() => {
      hud.classList.remove('show');
      document.body.classList.remove('show-cursor');
    }, 2400);
  }
  document.addEventListener('mousemove', showHud);
  document.addEventListener('touchstart', showHud);

  // Hide hint after 4s
  setTimeout(() => { hintEl.style.transition = 'opacity 0.6s'; hintEl.style.opacity = '0'; }, 4000);

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); paused ? resume() : pause(); }
    else if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key === 'Escape') finish();
    else if (e.key.toLowerCase() === 'f') {
      // toggle fullscreen
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
  });
})();
</script>
</body>
</html>
