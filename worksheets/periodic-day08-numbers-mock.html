<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/components.css">

<body class="worksheet-page">

  <div class="no-print" style="position:sticky; top:0; background:#6B21A8; color:white; padding:12px 20px; text-align:center; z-index:10;">
    <strong>📝 Day 8 · Chapter 1 (Numbers) — Cumulative Mock</strong> ·
    <a href="../maths-periodic-exam.html" style="color:#FACC15;">← 10-day plan</a>
    <button class="btn btn-yellow btn-sm" onclick="PP.printQuestions()" style="margin-left:10px;">🖨️ Print question paper</button>
    <button class="btn btn-teal btn-sm" onclick="PP.printAnswers()" style="margin-left:6px;">🗝️ Print answer key</button>
    <button class="btn btn-outline btn-sm" onclick="location.reload()" style="margin-left:6px; background:white;">🔄 New questions</button>
    <button class="btn btn-outline btn-sm" onclick="PP.toggleAnswers()" style="margin-left:6px; background:white;">👁️ Toggle key</button>
  </div>

  <div class="worksheet" id="paper"></div>

  <script src="../js/common.js"></script>
  <script src="../js/periodic-practice.js"></script>
  <script>
    PP.buildPaper({
      title: '📘 Day 8 · Chapter 1 (Numbers) — Cumulative Mock',
      subtitle: 'Maths Periodic Exam · Chapter 1 Numbers · Full revision paper',
      intro: 'Everything from Chapter 1 in one paper. Work steadily and check each answer before moving on.',
      sections: [
        { title: 'Put commas (Indian) & write the number name', gen: 'indianComma', count: 4, marks: 4 },
        { title: 'Write the numeral from the number name', gen: 'numeralFromWords', count: 3, marks: 3 },
        { title: 'Place value of the underlined digit', gen: 'placeValue', count: 4, marks: 4, grid: true },
        { title: 'Write the successor', gen: 'successor', count: 3, marks: 3, grid: true },
        { title: 'Write the predecessor', gen: 'predecessor', count: 3, marks: 3, grid: true },
        { title: 'Compare using >, < or =', gen: 'compare', count: 4, marks: 4 },
        { title: 'Round off (10 / 100 / 1000)', gen: 'rounding', count: 5, marks: 5 },
        { title: 'Write the Roman numeral', gen: 'romanTo', count: 4, marks: 4, grid: true }
      ]
    });
  </script>
</body>
