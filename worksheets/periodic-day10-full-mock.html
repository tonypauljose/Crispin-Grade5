<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 10 · FULL Mock Exam — Periodic Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/print.css">
</head>
<body class="worksheet-page">

  <div class="no-print" style="position:sticky; top:0; background:#6B21A8; color:white; padding:12px 20px; text-align:center; z-index:10;">
    <strong>📝 Day 10 · FULL Mock Exam (Chapters 1 + 2)</strong> ·
    <a href="../maths-periodic-exam.html" style="color:#FACC15;">← 10-day plan</a>
    <button class="btn btn-yellow btn-sm" onclick="PP.printQuestions()" style="margin-left:10px;">🖨️ Print question paper</button>
    <button class="btn btn-teal btn-sm" onclick="PP.printAnswers()" style="margin-left:6px;">🗝️ Print answer key</button>
    <button class="btn btn-outline btn-sm" onclick="location.reload()" style="margin-left:6px; background:white;">🔄 New questions</button>
    <button class="btn btn-outline btn-sm" onclick="PP.toggleAnswers()" style="margin-left:6px; background:white;">👁️ Toggle key</button>
  </div>

  <div class="worksheet" id="paper"></div>

  <script src="../js/common.js"></script>
  <script src="../js/periodic-practice.js"></script>
  <script>
    PP.buildPaper({
      title: '🏆 Day 10 · FULL Mock Exam',
      subtitle: 'Maths Periodic Exam · Chapters 1 & 2 · Final mock under exam conditions',
      intro: 'Sit this like the real test: 40 minutes, no peeking at the answer key. Cover the whole portion — Numbers and the Four Operations.',
      sections: [
        { title: 'Put commas (Indian) & write the number name', gen: 'indianComma', count: 3, marks: 3 },
        { title: 'Write the numeral from the number name', gen: 'numeralFromWords', count: 2, marks: 2 },
        { title: 'Place value of the underlined digit', gen: 'placeValue', count: 3, marks: 3, grid: true },
        { title: 'Round off (10 / 100 / 1000)', gen: 'rounding', count: 3, marks: 3 },
        { title: 'Roman numerals (write the Roman numeral)', gen: 'romanTo', count: 3, marks: 3, grid: true },
        { title: 'Compare using >, < or =', gen: 'compare', count: 3, marks: 3 },
        { title: 'Find the sum', gen: 'addition', count: 3, marks: 3 },
        { title: 'Find the difference', gen: 'subtraction', count: 3, marks: 3 },
        { title: 'Multiply — show working', gen: 'multiply', count: 2, marks: 2 },
        { title: 'Divide and check', gen: 'divideCheck', count: 2, marks: 2 },
        { title: 'Word problems', gen: 'wordProblem', count: 3, marks: 3, instructions: 'Write the numbers, the operation, your working, and the final answer.' }
      ]
    });
  </script>
</body>
</html>
